name: Build JAANI AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE="JAANI_AI_STUDIO_CORRECTED_SOURCE.zip"
            test -f "$ZIP_FILE"
            mkdir -p project
            unzip -q "$ZIP_FILE" -d project
            test -f project/settings.gradle.kts
            test -f project/app/build.gradle.kts
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAANI-AI-STUDIO-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
